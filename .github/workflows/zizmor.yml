name: Zizmor

# Static analysis of the GitHub Actions workflows themselves (injection,
# over-broad permissions, unpinned actions…). Results land in the Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 6 * * 1"

permissions:
  contents: read

# Superseded PR pushes are cancelled; main and the weekly scan run to completion.
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF results
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run zizmor
        run: pipx run zizmor==1.28.0 --format sarif . > zizmor.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
