version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine bumps land as one PR. Majors are deliberately left ungrouped:
      # in a single all-inclusive group, one breaking major blocks every patch
      # behind it until someone finds time to deal with it.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the native port: the npm package no longer exports the
      # classic compiler API, so every tool that reads it breaks — tsup's dts
      # step (rollup-plugin-dts) and react-docgen-typescript, which is what
      # fills Storybook's props tables. Drop this once both support TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
