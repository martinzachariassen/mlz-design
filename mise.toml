# mise (https://mise.jdx.dev) — pinned toolchain + task runner for this repo.
# Quickstart:  mise install   →   mise run setup   →   mise run storybook
# List tasks:  mise tasks

[tools]
# Latest toolchain; comfortably clears package.json "engines" and Storybook 10.
node = "26"
bun = "1.3"

# ── Setup ────────────────────────────────────────────────────────────────────
[tasks.setup]
description = "Install toolchain + dependencies (first-time setup)"
run = "bun install"

# ── Develop ──────────────────────────────────────────────────────────────────
[tasks.dev]
description = "Watch-build the package (tsup --watch)"
run = "bun run dev"

[tasks.storybook]
description = "Run the Storybook playground on :6006"
run = "bun run storybook"

# ── Quality ──────────────────────────────────────────────────────────────────
[tasks.lint]
description = "Biome check (JS/TS)"
run = "bun run lint"

[tasks.format]
description = "Biome check --write (auto-fix)"
run = "bun run lint:fix"

[tasks.typecheck]
description = "tsc --noEmit (strict)"
run = "bun run typecheck"

[tasks.test]
description = "Vitest + Testing Library"
run = "bun run test"

[tasks.skill-check]
description = "Fail if the mlz-design skill's generated references are stale"
run = "bun run skill:check"

[tasks.skill-inventory]
description = "Regenerate the skill's component + token references from src/"
run = "bun run skill:inventory"

# `.claude/` is gitignored local agent state, so the skill and the subagent are
# committed at skills/ and agents/ (which is also what npm publishes) and linked
# in from there. Run once per clone.
[tasks.agent-link]
description = "Symlink the committed skill + subagent into .claude/ for this clone"
run = '''
mkdir -p .claude/skills .claude/agents
ln -sfn ../../skills/mlz-design .claude/skills/mlz-design
ln -sfn ../../agents/design-review.md .claude/agents/design-review.md
echo "linked: .claude/skills/mlz-design, .claude/agents/design-review.md"
'''

# ── Build ────────────────────────────────────────────────────────────────────
[tasks.build]
description = "Build the package to dist/ (ESM + d.ts + styles)"
run = "bun run build"

[tasks.build-storybook]
description = "Build the static Storybook site"
run = "bun run build:storybook"

# ── Gates that CI runs and a plain build does not ────────────────────────────
[tasks.dist-check]
description = "Fail if committed dist/ is stale (mirrors the ci.yml step)"
depends = ["build"]
# Excludes the .d.ts: TypeScript's union member ordering is not stable across
# rebuilds, so comparing it fails at random. See the note in ci.yml.
run = '''
stale=$(git status --porcelain -- dist ':(exclude)dist/*.d.ts')
if [ -n "$stale" ]; then
  echo "dist/ is stale — run 'bun run build' and commit the result." >&2
  echo "$stale"
  exit 1
fi
'''

[tasks.a11y]
description = "Run axe (WCAG 2.1 A/AA) over every story"
depends = ["build-storybook"]
run = '''
bunx concurrently -k -s first -n "SB,A11Y" -c "magenta,blue" \
  "bunx http-server storybook-static --port 6006 --silent" \
  "bunx wait-on tcp:127.0.0.1:6006 && bun run test-storybook --url http://127.0.0.1:6006"
'''

# ── Aggregates ───────────────────────────────────────────────────────────────
[tasks.check]
description = "Run all fast checks (lint · typecheck · test · skill-check)"
depends = ["lint", "typecheck", "test", "skill-check"]

# Mirrors ci.yml exactly, including the two gates a plain build misses: the
# stale-dist check and the axe pass. Without them a green local run could still
# fail CI.
[tasks.ci]
description = "Full CI pipeline (lint · typecheck · test · build · dist-check · a11y)"
depends = ["lint", "typecheck", "test", "dist-check", "a11y"]
